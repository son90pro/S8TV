name: Tự động cập nhật S8TV M3U

on:
  schedule:
    - cron: '*/30 * * * *' # Chạy tự động mỗi 30 phút
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Thiết lập Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: pip install requests

      - name: Chạy Script Scraper
        run: python scraper.py

      - name: Commit và Push file M3U
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add s8tv.m3u
          git commit -m "Auto-update list m3u S8TV" || exit 0
          git push
          
